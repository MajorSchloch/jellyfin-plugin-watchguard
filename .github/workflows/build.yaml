name: Build and test WatchGuard
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: dotnet restore Jellyfin.Plugin.WatchGuard.slnx --locked-mode
      - run: dotnet build Jellyfin.Plugin.WatchGuard.slnx -c Release --no-restore
      - run: dotnet test Jellyfin.Plugin.WatchGuard.slnx -c Release --no-build --no-restore
      - run: node --test tests/web.test.cjs
      - run: python3 scripts/build-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: WatchGuard-v0.2.0
          path: |
            artifacts/Jellyfin.Plugin.WatchGuard-v0.2.0.zip
            artifacts/Jellyfin.Plugin.WatchGuard-v0.2.0.zip.sha256
