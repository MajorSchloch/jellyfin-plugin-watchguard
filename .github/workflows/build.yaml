name: Build and test WatchGuard
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      previous_stable_probe:
        description: 'Inject public 504s and verify real anonymous previous-stable API downloads'
        type: boolean
        default: false
      enforcement_baseline_probe:
        description: 'Inject public 504s and verify the pinned enforcement baseline and corrupt-input rejection'
        type: boolean
        default: false
concurrency:
  group: watchguard-development-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Verify Python is already in the hosted tool cache
        run: python3 scripts/ci/verify-python-cache.py before
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          check-latest: false
      - name: Verify setup selected the same local interpreter
        run: python3 scripts/ci/verify-python-cache.py after
      - uses: actions/upload-artifact@v6
        with:
          name: WatchGuard-python-selection
          path: artifacts/python-selection.json
          if-no-files-found: error
      - id: candidate
        run: python3 scripts/release_plan.py --metadata-only
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: dotnet restore Jellyfin.Plugin.WatchGuard.slnx --locked-mode
      - run: dotnet build Jellyfin.Plugin.WatchGuard.slnx -c Release --no-restore
      - run: dotnet test Jellyfin.Plugin.WatchGuard.slnx -c Release --no-build --no-restore
        env:
          WATCHGUARD_BENCHMARK_OUTPUT: /tmp/discovery-model-v048.json
          WATCHGUARD_VERIFICATION_MODEL_OUTPUT: /tmp/verification-model-v048.json
      - run: node --test tests/web.test.cjs tests/standalone-bootstrap.test.cjs tests/startup.test.cjs tests/server-enforcement.test.cjs tests/browser-readiness.test.cjs
      - uses: actions/upload-artifact@v6
        with:
          name: discovery-model-v048
          path: |
            /tmp/discovery-model-v048.json
            /tmp/verification-model-v048.json
      - run: python3 -m py_compile tests/native_proxy_policy.py tests/server-enforcement.py
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 scripts/build-release.py
      - run: python3 scripts/qualification_policy.py --check
      - run: python3 scripts/check-release-notes.py
      - run: python3 tests/catalog_test.py
      - name: Protect published installation metadata
        run: |
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/MajorSchloch/jellyfin-plugin-watchguard/master/manifest.json -o /tmp/watchguard-published-catalog.json
          python3 scripts/catalog.py --check-history /tmp/watchguard-published-catalog.json
      - run: python3 scripts/catalog.py --zip artifacts/${{ steps.candidate.outputs.package }}
      - uses: actions/upload-artifact@v6
        with:
          name: WatchGuard-v${{ steps.candidate.outputs.version }}
          path: |
            artifacts/${{ steps.candidate.outputs.package }}
            artifacts/${{ steps.candidate.outputs.package }}.sha256
      - name: Verify previous-stable fallback with real public assets
        if: github.event_name == 'workflow_dispatch' && inputs.previous_stable_probe
        run: python3 tests/previous_stable_download_probe.py
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v6
        if: github.event_name == 'workflow_dispatch' && inputs.previous_stable_probe
        with:
          name: WatchGuard-previous-stable-download-probe
          path: artifacts/previous-stable-download-probe.json
          if-no-files-found: error
      - name: Verify shared enforcement baseline fallback and offline consumers
        if: github.event_name == 'workflow_dispatch' && inputs.enforcement_baseline_probe
        run: python3 tests/enforcement_baseline_probe.py
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v6
        if: github.event_name == 'workflow_dispatch' && inputs.enforcement_baseline_probe
        with:
          name: WatchGuard-enforcement-baseline-probe
          path: artifacts/enforcement-baseline-probe.json
          if-no-files-found: error
