name: Build and test WatchGuard
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: dotnet restore Jellyfin.Plugin.WatchGuard.slnx --locked-mode
      - run: dotnet build Jellyfin.Plugin.WatchGuard.slnx -c Release --no-restore
      - run: dotnet test Jellyfin.Plugin.WatchGuard.slnx -c Release --no-build --no-restore
      - run: node --test tests/web.test.cjs tests/standalone-bootstrap.test.cjs
      - run: python3 scripts/build-release.py
      - run: python3 tests/catalog_test.py
      - run: python3 scripts/catalog.py --zip artifacts/Jellyfin.Plugin.WatchGuard-v0.4.3.zip
      - uses: actions/upload-artifact@v6
        with:
          name: WatchGuard-v0.4.3
          path: |
            artifacts/Jellyfin.Plugin.WatchGuard-v0.4.3.zip
            artifacts/Jellyfin.Plugin.WatchGuard-v0.4.3.zip.sha256
