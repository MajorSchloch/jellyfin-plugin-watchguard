name: Qualify WatchGuard
on:
  push:
    branches: [master]
    paths-ignore:
      # Publication writes only this file. Other pushes get a read-only state
      # check, so documentation fixes to an unpublished candidate can qualify.
      - 'manifest.json'
  workflow_dispatch:
    inputs:
      publish:
        description: Request publication after qualification (release environment approval remains required)
        type: boolean
        default: false
      inspect_only:
        description: Check release state without builds, fixtures or writes
        type: boolean
        default: false
      proxy_matrix:
        description: Include disposable Nginx, Traefik, tunnel-style and native HTTPS qualification
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  # Qualification never cancels another attempt. Publication has a separate global lock.
  group: ${{ inputs.inspect_only && format('watchguard-inspect-{0}', github.ref) || format('watchguard-qualification-{0}', github.ref) }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      package: ${{ steps.plan.outputs.package }}
      qualify: ${{ steps.plan.outputs.qualify }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_plan.py --publish '${{ github.event_name == 'push' || inputs.publish }}' --inspect-only '${{ inputs.inspect_only || false }}'
      - id: matrix
        run: echo "matrix=$(python3 scripts/qualification_policy.py --matrix)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: WatchGuard-release-plan-attempt-${{ github.run_attempt }}
          path: artifacts/release-plan.json
          if-no-files-found: error

  build:
    needs: plan
    if: needs.plan.outputs.qualify == 'true'
    outputs:
      package_id: ${{ steps.package.outputs.artifact-id }}
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.0'
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.0'
      - run: python3 scripts/build-release.py
      - run: dotnet test Jellyfin.Plugin.WatchGuard.slnx -c Release --no-restore --logger trx --results-directory artifacts/testing/backend
        env:
          WATCHGUARD_BENCHMARK_OUTPUT: /tmp/discovery-model-v048.json
          WATCHGUARD_VERIFICATION_MODEL_OUTPUT: /tmp/verification-model-v048.json
      - run: node --test tests/web.test.cjs tests/standalone-bootstrap.test.cjs tests/startup.test.cjs tests/server-enforcement.test.cjs tests/browser-readiness.test.cjs
      - uses: actions/upload-artifact@v6
        with:
          name: discovery-model-v048-attempt-${{ github.run_attempt }}
          path: |
            /tmp/discovery-model-v048.json
            /tmp/verification-model-v048.json
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 scripts/qualification_policy.py --check
      - run: python3 scripts/check-release-notes.py
      - run: python3 tests/catalog_test.py
      - name: Protect published installation metadata
        run: |
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/MajorSchloch/jellyfin-plugin-watchguard/master/manifest.json -o /tmp/watchguard-published-catalog.json
          python3 scripts/catalog.py --check-history /tmp/watchguard-published-catalog.json
      - run: python3 scripts/catalog.py --zip artifacts/${{ needs.plan.outputs.package }}
      - name: Verify previous stable once for direct upgrade
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/previous_stable.py
      - uses: actions/upload-artifact@v6
        with:
          name: WatchGuard-previous-stable-attempt-${{ github.run_attempt }}
          path: artifacts/previous-stable/
          if-no-files-found: error
      - name: Rebuild and verify determinism
        run: |
          cp artifacts/${{ needs.plan.outputs.package }}.sha256 /tmp/first.sha256
          python3 scripts/build-release.py
          cmp /tmp/first.sha256 artifacts/${{ needs.plan.outputs.package }}.sha256
      - name: Retain build and backend test diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: WatchGuard-build-diagnostics-attempt-${{ github.run_attempt }}
          path: artifacts/testing/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v6
        id: package
        with:
          name: WatchGuard-package-attempt-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            artifacts/${{ needs.plan.outputs.package }}
            artifacts/${{ needs.plan.outputs.package }}.sha256

  integration:
    name: Integration / ${{ matrix.jellyfin_version }} / ${{ matrix.shard }}
    env:
      WATCHGUARD_JELLYFIN_VERSION: ${{ matrix.jellyfin_version }}
    needs: [plan, build]
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - name: Resolve balanced suite plan
        id: plan
        run: echo "suites=$(python3 scripts/qualification_policy.py --suites '${{ matrix.shard }}')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.0'
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.0'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - uses: actions/download-artifact@v6
        with:
          name: WatchGuard-package-attempt-${{ github.run_attempt }}
          path: artifacts
      - name: Extract verified release candidate for Docker fixture
        run: |
          cd artifacts
          sha256sum -c ${{ needs.plan.outputs.package }}.sha256
          mkdir -p WatchGuard
          unzip -p ${{ needs.plan.outputs.package }} Jellyfin.Plugin.WatchGuard.dll > WatchGuard/Jellyfin.Plugin.WatchGuard.dll
      - uses: actions/download-artifact@v6
        if: matrix.shard == 'upgrade'
        with:
          name: WatchGuard-previous-stable-attempt-${{ github.run_attempt }}
          path: artifacts/previous-stable
      - run: npm ci --prefix tests/browser
      - name: Preinstalled browser setup
        run: bash scripts/ci/setup-browser.sh
      - name: Verify locked browser and diagnostic tools
        run: node tests/browser-environment.cjs
      - name: Install zstd decoder where tested
        if: contains(fromJSON(steps.plan.outputs.suites), 'upgrade') || contains(fromJSON(steps.plan.outputs.suites), 'server-enforcement')
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Pull pinned test image with registry backoff
        run: |
          set -euo pipefail
          python3 - <<'PYCODE' > /tmp/watchguard-shard-images.txt
          import json, sys
          sys.path.insert(0, 'tests')
          import fixture_images
          suites = json.load(open('scripts/qualification-policy.json'))['shards']['${{ matrix.shard }}']
          linuxserver = {'upgrade','server-enforcement-linuxserver'}
          print('\n'.join(sorted({fixture_images.image(s in linuxserver) for s in suites})))
          PYCODE
          mkdir -p artifacts/testing
          while IFS= read -r image; do
          for attempt in 1 2 3 4 5; do
            echo "$attempt" > artifacts/testing/image-pull-attempts.txt
            if docker pull "$image"; then break; fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep "$((attempt * 20))"
          done
          done < /tmp/watchguard-shard-images.txt
      - name: Set up verified Chromium 79
        if: matrix.shard == 'browser79'
        run: |
          npm ci --prefix tests/browser79
          curl --fail --location --connect-timeout 15 --max-time 120 https://storage.googleapis.com/chromium-browser-snapshots/Linux_x64/706915/chrome-linux.zip -o /tmp/chromium79.zip
          echo '647c9f1a9be953a7bdbcb59ec52fece3ef192945a674443114572e98b56b7e59  /tmp/chromium79.zip' | sha256sum -c -
          unzip -q /tmp/chromium79.zip -d /tmp/watchguard-browser79
          echo 'WATCHGUARD_CHROMIUM79=/tmp/watchguard-browser79/chrome-linux/chrome' >> "$GITHUB_ENV"
      - name: Complete disposable regression suite
        env:
          WATCHGUARD_REQUIRE_PROXY_MATRIX: ${{ (github.event_name == 'push' || inputs.proxy_matrix || inputs.publish) && '1' || '0' }}
        run: python3 tests/run_shard.py "${{ matrix.shard }}"
      - name: Summarize setup failure without suite evidence
        if: failure() && hashFiles('artifacts/suites/**/suite.json') == ''
        run: python3 tests/summarize_qualification.py
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: WatchGuard-browser-failure-${{ matrix.jellyfin_version }}-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: |
            artifacts/suites/
            artifacts/testing/
            artifacts/v049/
            artifacts/server-enforcement/
          if-no-files-found: warn
      - name: Upload suite evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: WatchGuard-evidence-${{ matrix.jellyfin_version }}-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: |
            artifacts/suites/
            artifacts/testing/
          if-no-files-found: warn

  qualification:
    name: Verify complete compatibility evidence
    permissions:
      contents: read
      actions: read
    needs: [plan, build, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.0'
      - uses: actions/download-artifact@v6
        with:
          name: WatchGuard-package-attempt-${{ github.run_attempt }}
          path: artifacts
      - uses: actions/download-artifact@v6
        with:
          pattern: WatchGuard-evidence-*-attempt-${{ github.run_attempt }}
          path: artifacts/qualification
      - name: Require every host and suite to have tested this exact package
        run: python3 scripts/qualification.py --package artifacts/${{ needs.plan.outputs.package }} --evidence artifacts/qualification --commit "$GITHUB_SHA" --proxy-matrix '${{ github.event_name == 'push' || inputs.proxy_matrix || inputs.publish }}' --output artifacts/qualification.json
      - name: Seal the exact run and artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_ID: ${{ needs.build.outputs.package_id }}
          PUBLISH_REQUESTED: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          python3 - <<'PYCODE'
          import json, os, sys
          sys.path.insert(0, 'scripts')
          from release_provenance import seal
          from release_state import GitHub
          result = json.load(open('artifacts/qualification.json'))
          record = seal(GitHub(os.environ['GITHUB_REPOSITORY']), result, int(os.environ['PACKAGE_ID']), int(os.environ['GITHUB_RUN_ATTEMPT']), os.environ['PUBLISH_REQUESTED'] == 'true')
          open('artifacts/qualification-record.json', 'w').write(json.dumps(record, indent=2) + '\n')
          PYCODE
      - uses: actions/upload-artifact@v6
        with:
          name: WatchGuard-qualification-attempt-${{ github.run_attempt }}
          path: artifacts/qualification-record.json
          if-no-files-found: error
      - name: Qualified; publication requires separate environment approval
        run: echo 'Qualified this exact commit and package. Requested publication continues in Publish WatchGuard. For publication recovery, use Re-run failed jobs on Publish WatchGuard. The original sealed qualification record remains the source.' >> "$GITHUB_STEP_SUMMARY"
      - name: Report execution and queue timing separately
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/timings.py --output artifacts/qualification-timings.json
      - uses: actions/upload-artifact@v6
        with:
          name: WatchGuard-qualification-diagnostics-attempt-${{ github.run_attempt }}
          path: |
            artifacts/qualification.json
            artifacts/qualification-timings.json
          if-no-files-found: error

  publication-rehearsal:
    needs: [qualification]
    if: github.event_name == 'workflow_dispatch' && !inputs.publish && inputs.proxy_matrix
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Verify publisher provenance without approval or writes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_release.py --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --validate-branch --verify-record
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: WatchGuard-publication-rehearsal-attempt-${{ github.run_attempt }}
          path: artifacts/publication-result.json
          if-no-files-found: warn

  status:
    if: always()
    needs: [plan, build, integration, qualification]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: State the result and next action
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          QUALIFY: ${{ needs.plan.outputs.qualify }}
          QUALIFICATION_RESULT: ${{ needs.qualification.result }}
        run: |
          if [ "$QUALIFICATION_RESULT" = success ]; then
            echo '## Qualified' >> "$GITHUB_STEP_SUMMARY"
            echo "Exact source: $GITHUB_SHA; run $GITHUB_RUN_ID; attempt $GITHUB_RUN_ATTEMPT. Review the record. Requested publication continues through the release environment approval." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$PLAN_RESULT" = success ] && [ "$QUALIFY" != true ]; then
            echo '## State checked' >> "$GITHUB_STEP_SUMMARY"
            echo 'No build or matrix ran. Follow the state check summary for any explicit recovery action.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## Blocked' >> "$GITHUB_STEP_SUMMARY"
            echo 'Inspect the failed job and this attempt’s diagnostics. No new record authorizes publication. Correct the cause before a new complete qualification attempt.' >> "$GITHUB_STEP_SUMMARY"
          fi
