name: Prepare or publish WatchGuard
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish v0.4.7 and update the public catalog (requires release environment approval)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: watchguard-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: python3 scripts/build-release.py
      - run: dotnet test Jellyfin.Plugin.WatchGuard.slnx -c Release --no-restore
        env:
          WATCHGUARD_BENCHMARK_OUTPUT: /tmp/discovery-model-v047.json
          WATCHGUARD_VERIFICATION_MODEL_OUTPUT: /tmp/verification-model-v047.json
      - run: node --test tests/web.test.cjs tests/standalone-bootstrap.test.cjs
      - uses: actions/upload-artifact@v6
        with:
          name: discovery-model-v047
          path: |
            /tmp/discovery-model-v047.json
            /tmp/verification-model-v047.json
      - run: python3 tests/catalog_test.py
      - run: python3 scripts/catalog.py --zip artifacts/Jellyfin.Plugin.WatchGuard-v0.4.7.zip
      - name: Compare identical models with published v0.4.6
        run: |
          curl --fail --location --retry 3 https://github.com/MajorSchloch/jellyfin-plugin-watchguard/releases/download/v0.4.6/Jellyfin.Plugin.WatchGuard-v0.4.6.zip -o artifacts/Jellyfin.Plugin.WatchGuard-v0.4.6.zip
          python3 tests/verification-model.py
      - uses: actions/upload-artifact@v6
        with:
          name: published-baseline-model-v047
          path: |
            artifacts/verification-model-v047-before.json
            artifacts/discovery-model-v047-before.json
      - name: Rebuild and verify determinism
        run: |
          cp artifacts/Jellyfin.Plugin.WatchGuard-v0.4.7.zip.sha256 /tmp/first.sha256
          python3 scripts/build-release.py
          cmp /tmp/first.sha256 artifacts/Jellyfin.Plugin.WatchGuard-v0.4.7.zip.sha256
      - uses: actions/upload-artifact@v6
        with:
          name: WatchGuard-v0.4.7-validated
          if-no-files-found: error
          path: |
            artifacts/Jellyfin.Plugin.WatchGuard-v0.4.7.zip
            artifacts/Jellyfin.Plugin.WatchGuard-v0.4.7.zip.sha256

  integration:
    name: Integration / ${{ matrix.suite }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [standalone-caddy, migration, basepath, legacy, websocket, discovery, verification]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - uses: actions/download-artifact@v6
        with:
          name: WatchGuard-v0.4.7-validated
          path: artifacts
      - name: Extract verified release candidate for Docker fixture
        run: |
          cd artifacts
          sha256sum -c Jellyfin.Plugin.WatchGuard-v0.4.7.zip.sha256
          mkdir -p WatchGuard
          unzip -p Jellyfin.Plugin.WatchGuard-v0.4.7.zip Jellyfin.Plugin.WatchGuard.dll > WatchGuard/Jellyfin.Plugin.WatchGuard.dll
      - name: Build Injector fixture (rollback/legacy only)
        if: matrix.suite == 'migration' || matrix.suite == 'legacy'
        run: |
          git clone https://github.com/n00bcodr/Jellyfin-JavaScript-Injector.git /tmp/watchguard-injector
          git -C /tmp/watchguard-injector checkout --detach 2758804c987d490ef32fc2fbdb8a73a44facdf2c
          dotnet build /tmp/watchguard-injector/Jellyfin.Plugin.JavaScriptInjector/Jellyfin.Plugin.JavaScriptInjector.csproj -c Release -p:JellyfinTarget=jf12 -p:JellyfinVersion=12.2.0
      - run: npm ci --prefix tests/browser
      - run: cd tests/browser && npx playwright install --with-deps chromium
      - name: Install zstd decoder where tested
        if: matrix.suite == 'standalone-caddy' || matrix.suite == 'websocket'
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Download and verify standalone rollback fixture
        if: matrix.suite == 'standalone-caddy'
        run: |
          curl --fail --location --retry 3 https://github.com/MajorSchloch/jellyfin-plugin-watchguard/releases/download/v0.4.0/Jellyfin.Plugin.WatchGuard-v0.4.0.zip -o artifacts/Jellyfin.Plugin.WatchGuard-v0.4.0.zip
          echo '439fdc1accf4922e7f6eb8d01451e8d83f3343d656ef65d778f5dc99163bda4d  artifacts/Jellyfin.Plugin.WatchGuard-v0.4.0.zip' | sha256sum -c -
      - name: Download and verify v0.4.1 production baseline
        if: matrix.suite == 'standalone-caddy'
        run: |
          curl --fail --location --retry 3 https://github.com/MajorSchloch/jellyfin-plugin-watchguard/releases/download/v0.4.1/Jellyfin.Plugin.WatchGuard-v0.4.1.zip -o artifacts/Jellyfin.Plugin.WatchGuard-v0.4.1.zip
          echo 'b679195d7bc914ff64c6b311fa2938de0084ef195f447b92338284e10dd8411e  artifacts/Jellyfin.Plugin.WatchGuard-v0.4.1.zip' | sha256sum -c -
      - name: Download and verify v0.4.2 production baseline
        if: matrix.suite == 'standalone-caddy'
        run: |
          curl --fail --location --retry 3 https://github.com/MajorSchloch/jellyfin-plugin-watchguard/releases/download/v0.4.2/Jellyfin.Plugin.WatchGuard-v0.4.2.zip -o artifacts/Jellyfin.Plugin.WatchGuard-v0.4.2.zip
          echo 'c4902b23a1125fe3db26ffe77520a0a14eeca54bff946879cc4a3a73044858a5  artifacts/Jellyfin.Plugin.WatchGuard-v0.4.2.zip' | sha256sum -c -
      - name: Download and verify v0.4.3 production baseline
        if: matrix.suite == 'standalone-caddy'
        run: |
          curl --fail --location --retry 3 https://github.com/MajorSchloch/jellyfin-plugin-watchguard/releases/download/v0.4.3/Jellyfin.Plugin.WatchGuard-v0.4.3.zip -o artifacts/Jellyfin.Plugin.WatchGuard-v0.4.3.zip
          echo 'fc8bcb6e312f37fe73749ee0450a57f5dfda8fc4470549c633c1e3920271be47  artifacts/Jellyfin.Plugin.WatchGuard-v0.4.3.zip' | sha256sum -c -
      - name: Download and verify v0.4.4 production baseline
        if: matrix.suite == 'standalone-caddy'
        run: |
          curl --fail --location --retry 3 https://github.com/MajorSchloch/jellyfin-plugin-watchguard/releases/download/v0.4.4/Jellyfin.Plugin.WatchGuard-v0.4.4.zip -o artifacts/Jellyfin.Plugin.WatchGuard-v0.4.4.zip
          echo '516f29160d4e6efb7296867d7a00848124306af804586dedceea9e6828d2e679  artifacts/Jellyfin.Plugin.WatchGuard-v0.4.4.zip' | sha256sum -c -
      - name: Download and verify v0.4.5 production baseline
        if: matrix.suite == 'standalone-caddy' || matrix.suite == 'discovery' || matrix.suite == 'verification'
        run: |
          curl --fail --location --retry 3 https://github.com/MajorSchloch/jellyfin-plugin-watchguard/releases/download/v0.4.5/Jellyfin.Plugin.WatchGuard-v0.4.5.zip -o artifacts/Jellyfin.Plugin.WatchGuard-v0.4.5.zip
          echo 'ebe3827470e439bd0a15f7fb65edfa330c6ecf2d1f8ec4112402680f109f709f  artifacts/Jellyfin.Plugin.WatchGuard-v0.4.5.zip' | sha256sum -c -
      - name: Download and verify published legacy fixtures where needed
        if: matrix.suite == 'migration' || matrix.suite == 'legacy'
        run: |
          curl --fail --location --retry 3 https://github.com/MajorSchloch/jellyfin-plugin-watchguard/releases/download/v0.3.1/Jellyfin.Plugin.WatchGuard-v0.3.1.zip -o artifacts/Jellyfin.Plugin.WatchGuard-v0.3.1.zip
          echo 'c4ac915c3f35a28e6737bd68580f712cd0e0e113735a6d399c2a889c7ae7b2f2  artifacts/Jellyfin.Plugin.WatchGuard-v0.3.1.zip' | sha256sum -c -
          curl --fail --location --retry 3 https://github.com/MajorSchloch/jellyfin-plugin-watchguard/releases/download/v0.3.0/Jellyfin.Plugin.WatchGuard-v0.3.0.zip -o artifacts/Jellyfin.Plugin.WatchGuard-v0.3.0.zip
          echo '4ce9f89924391e9842ba444b7dd0d2fcf509a23845497b45f601c2f3c18339a6  artifacts/Jellyfin.Plugin.WatchGuard-v0.3.0.zip' | sha256sum -c -
          curl --fail --location --retry 3 https://github.com/MajorSchloch/jellyfin-plugin-watchguard/releases/download/v0.4.0/Jellyfin.Plugin.WatchGuard-v0.4.0.zip -o artifacts/Jellyfin.Plugin.WatchGuard-v0.4.0.zip
          echo '439fdc1accf4922e7f6eb8d01451e8d83f3343d656ef65d778f5dc99163bda4d  artifacts/Jellyfin.Plugin.WatchGuard-v0.4.0.zip' | sha256sum -c -
          mkdir -p artifacts/RollbackV031
          unzip -p artifacts/Jellyfin.Plugin.WatchGuard-v0.3.1.zip Jellyfin.Plugin.WatchGuard.dll > artifacts/RollbackV031/Jellyfin.Plugin.WatchGuard.dll
      - name: Pull pinned test image with registry backoff
        run: |
          set -euo pipefail
          if [[ "${{ matrix.suite }}" == 'basepath' || "${{ matrix.suite }}" == 'legacy' || "${{ matrix.suite }}" == 'discovery' || "${{ matrix.suite }}" == 'verification' ]]; then
            image='jellyfin/jellyfin:12.2@sha256:357724bf0ae27a672c7cbaa899db2d9abeb13dbd8657ccce750258a4c059d037'
          else
            image='lscr.io/linuxserver/jellyfin:12.2ubu2604-ls53@sha256:1bb4f88d822a0510bb3604b68aacb80d77c1d2a30181e500090c65111b98723b'
          fi
          for attempt in 1 2 3 4 5; do
            if docker pull "$image"; then break; fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep "$((attempt * 20))"
          done
      - name: Download and verify published v0.4.6
        if: matrix.suite == 'standalone-caddy' || matrix.suite == 'verification'
        run: |
          curl --fail --location --retry 3 https://github.com/MajorSchloch/jellyfin-plugin-watchguard/releases/download/v0.4.6/Jellyfin.Plugin.WatchGuard-v0.4.6.zip -o artifacts/Jellyfin.Plugin.WatchGuard-v0.4.6.zip
          echo 'e083f873d76a2cd62005e1093f30ecfde3201409fa9caa45948433372bba87e1  artifacts/Jellyfin.Plugin.WatchGuard-v0.4.6.zip' | sha256sum -c -
      - name: Complete disposable regression suite
        run: |
          case "${{ matrix.suite }}" in
            standalone-caddy)
              python3 tests/docker-smoke.py --linuxserver --catalog --caddy ;;
            migration)
              python3 tests/docker-smoke.py --linuxserver --migration --injector-dll /tmp/watchguard-injector/Jellyfin.Plugin.JavaScriptInjector/bin/Release/net10.0/Jellyfin.Plugin.JavaScriptInjector.dll ;;
            basepath)
              if ! python3 tests/docker-smoke.py --base-path /jellyfin --proxy; then
                echo "::warning::Base-path browser fixture failed; rerunning complete regression once with a fresh container"
                python3 tests/docker-smoke.py --base-path /jellyfin --proxy
              fi ;;
            legacy)
              python3 tests/docker-smoke.py --legacy-injector --catalog --injector-dll /tmp/watchguard-injector/Jellyfin.Plugin.JavaScriptInjector/bin/Release/net10.0/Jellyfin.Plugin.JavaScriptInjector.dll
              python3 tests/docker-smoke.py --legacy-injector --injector-dll /tmp/watchguard-injector/Jellyfin.Plugin.JavaScriptInjector/bin/Release/net10.0/Jellyfin.Plugin.JavaScriptInjector.dll ;;
            discovery)
              python3 tests/docker-smoke.py --profile discovery ;;
            verification)
              python3 tests/docker-smoke.py --profile verification
              WATCHGUARD_DISCOVERY_BASELINE=0.4.6 python3 tests/docker-smoke.py --profile discovery ;;
            websocket)
              python3 tests/docker-smoke.py --linuxserver --caddy --measure ;;
          esac
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: WatchGuard-browser-failure-${{ matrix.suite }}
          path: artifacts/v047/
          if-no-files-found: warn
      - name: Upload suite evidence
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: WatchGuard-evidence-${{ matrix.suite }}
          path: |
            artifacts/settings-validation.json
            artifacts/catalog-validation.json
            artifacts/v047/
            artifacts/standalone/caddy-http.json
            artifacts/standalone/socket-standalone.json
            artifacts/migration-v047.json
            artifacts/catalog-upgrade-v047.json
            artifacts/discovery-native-v047-*.json
            artifacts/verification-native-v047.json
          if-no-files-found: warn

  publish:
    if: inputs.publish && github.ref_name == github.event.repository.default_branch
    needs: [build, integration]
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          name: WatchGuard-v0.4.7-validated
          path: artifacts
      - name: Refuse publication from stale catalog history
        run: |
          python3 - <<'PYCODE'
          import json, os, urllib.request
          url = 'https://raw.githubusercontent.com/' + os.environ['GITHUB_REPOSITORY'] + '/master/manifest.json'
          with urllib.request.urlopen(url, timeout=30) as response:
              published = json.load(response)
          local = json.load(open('manifest.json'))
          for package in published:
              current = next(p for p in local if p['guid'] == package['guid'])
              for version in package['versions']:
                  if version not in current['versions']:
                      raise SystemExit('Published catalog history differs: reconcile the branch without changing existing entries before publishing.')
          PYCODE
      - name: Publish only after explicit workflow request and environment approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh repo view "$GITHUB_REPOSITORY" --json isPrivate --jq .isPrivate)" = false
          python3 scripts/catalog.py --zip artifacts/Jellyfin.Plugin.WatchGuard-v0.4.7.zip
          # No replacement of existing immutable release assets.
          gh release create v0.4.7 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title 'WatchGuard v0.4.7' --notes-file docs/verification-performance-v047.md
          gh release upload v0.4.7 artifacts/Jellyfin.Plugin.WatchGuard-v0.4.7.zip artifacts/Jellyfin.Plugin.WatchGuard-v0.4.7.zip.sha256 --repo "$GITHUB_REPOSITORY"
          gh release edit v0.4.7 --draft=false --repo "$GITHUB_REPOSITORY"
      - name: Verify public assets and update version history
        run: python3 scripts/catalog.py --from-release "$GITHUB_REPOSITORY" v0.4.7 --zip artifacts/Jellyfin.Plugin.WatchGuard-v0.4.7.zip
      - name: Commit verified manifest to the source branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add manifest.json
          git commit -m 'Update WatchGuard catalog for v0.4.7'
          git push origin "HEAD:$GITHUB_REF_NAME"
